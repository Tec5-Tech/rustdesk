# Minimal, self-contained build of ONLY the Windows x64 Flutter desktop client.
# Recipe extracted from the fork's flutter-build.yml / bridge.yml / build.py.
# Signing + matrix stripped; no secrets required. Manual trigger.
name: Windows x64 (minimal, manual)

on:
  workflow_dispatch:
  # Push to the dedicated `ci` branch to trigger a build (works without the
  # Actions:write permission that workflow_dispatch needs).
  push:
    branches: [ci]
    # A version tag (v1.2.3) builds AND publishes a GitHub release with the
    # zipped bridge binary, so the installer can fetch it self-contained.
    tags: ["v*"]

permissions:
  contents: write  # create the release on a tag

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_ROOT: C:\vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # Fail fast on a misconfigured signing secret BEFORE the ~40-min build, with
      # an actionable message instead of a raw base64/signtool error late in the run.
      # Absent secret = intentional unsigned build (not an error).
      - name: Validate code-signing secrets (early)
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX_B64) {
            Write-Host "::notice::No CODESIGN_PFX_B64 secret set - this build will be UNSIGNED."
            exit 0
          }
          try {
            $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX_B64.Trim())
          } catch {
            Write-Host "::error::CODESIGN_PFX_B64 is not valid base64. Re-export it, e.g. PowerShell: [IO.File]::ReadAllText('codesign.pfx.b64').Trim() | Set-Clipboard, then paste into the secret."
            exit 1
          }
          if (-not $env:CODESIGN_PFX_PASSWORD) {
            Write-Host "::error::CODESIGN_PFX_PASSWORD secret is empty/unset. Set it to the .pfx password (no trailing newline)."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign-validate.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          try {
            $c = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:CODESIGN_PFX_PASSWORD)
            Write-Host "::notice::Code-signing cert OK - subject '$($c.Subject)', thumbprint $($c.Thumbprint), expires $($c.NotAfter)."
          } catch {
            Write-Host "::error::Could not open the .pfx with CODESIGN_PFX_PASSWORD (wrong password or corrupt pfx): $($_.Exception.Message)"
            exit 1
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore/Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (x64-windows-static)
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Install flutter_rust_bridge codegen deps
        shell: bash
        run: |
          cargo install cargo-expand --version "${CARGO_EXPAND_VERSION}" --locked
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features "uuid" --locked
          pushd flutter && flutter pub get && popd

      - name: Run flutter_rust_bridge codegen
        shell: bash
        run: |
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Build RustDesk (Flutter, Windows x64)
        id: build
        shell: bash
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      # Sign only when a code-signing cert is configured as a secret; otherwise
      # the build proceeds unsigned (no failure). Set CODESIGN_PFX_B64 (base64 of
      # the .pfx) and CODESIGN_PFX_PASSWORD to enable.
      - name: Sign binaries (if a code-signing cert is configured)
        id: sign
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX_B64) {
            Write-Host "No CODESIGN_PFX_B64 secret; unsigned build."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          # Secrets were validated early; .Trim() guards against stray whitespace.
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_B64.Trim()))
          $rel = 'flutter/build/windows/x64/runner/Release'
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                 Sort-Object FullName | Select-Object -Last 1).FullName
          & $st sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 `
             /tr http://timestamp.digicert.com /td SHA256 `
             "$rel\rustdesk.exe" "$rel\librustdesk.dll"
          Remove-Item $pfx -Force
          if ($LASTEXITCODE -ne 0) {
            "signed=false" >> $env:GITHUB_OUTPUT
            throw "signtool failed ($LASTEXITCODE)"
          }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-x86_64
          # --skip-portable-pack leaves the app in the standard Flutter output dir,
          # not ./rustdesk.
          path: flutter/build/windows/x64/runner/Release
          if-no-files-found: error

      # On a version tag, zip the build and publish it as a GitHub release so the
      # installer can fetch a stable, versioned bridge binary (artifacts expire).
      - name: Package + publish release
        # Publish on a tag as long as the BUILD succeeded, even if signing failed,
        # so a signing hiccup never leaves a tag with zero artifacts. A failed sign
        # step still turns the run red (visible), but the binary still ships. A bad
        # signing SECRET fails fast in "Validate code-signing secrets" before the
        # build, so it never reaches here.
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && steps.build.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          zip_name="rustdesk-bridge-${GITHUB_REF_NAME}-windows-x86_64.zip"
          ( cd flutter/build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/$zip_name" ./* )
          if [ "$SIGNED" = "true" ]; then
            notes="Authenticode-signed Windows x64 bridge binary (SHA256, DigiCert-timestamped). After extracting, configure it with install/gen_config.py (MCP enable + token + rendezvous server/key). The signing cert is self-signed — trust its root on target hosts to clear the unknown-publisher prompt (see docs/signing.md). See docs/packaging.md."
          else
            notes="UNSIGNED Windows x64 bridge binary (no signing cert configured, or the signing step failed — check the run log). After extracting, configure it with install/gen_config.py (MCP enable + token + rendezvous server/key). See docs/packaging.md."
          fi
          gh release create "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/$zip_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RustDesk MCP bridge $GITHUB_REF_NAME" \
            --notes "$notes"
